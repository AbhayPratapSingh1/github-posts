<!DOCTYPE html>
<html>
<head>
    <title>API Performance Heatmap</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background: #1a1a2e; color: #eee; }
        h1 { color: #00d4ff; text-align: center; }
        .container { max-width: 1200px; margin: 0 auto; }
        .heatmap { margin: 20px 0; }
        .row { display: flex; margin: 5px 0; align-items: center; }
        .label { width: 150px; font-weight: bold; font-size: 14px; }
        .cells { display: flex; gap: 3px; flex: 1; }
        .cell { 
            width: 40px; 
            height: 30px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 10px;
            border-radius: 3px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .cell:hover { transform: scale(1.2); z-index: 10; }
        .legend { display: flex; gap: 20px; margin: 20px 0; justify-content: center; }
        .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; }
        .legend-color { width: 20px; height: 20px; border-radius: 3px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin: 30px 0; }
        .stat-card { 
            background: #16213e; 
            padding: 20px; 
            border-radius: 10px; 
            text-align: center;
            border: 1px solid #0f3460;
        }
        .stat-value { font-size: 24px; font-weight: bold; color: #00d4ff; }
        .stat-label { font-size: 12px; color: #888; margin-top: 5px; }
        .tooltip { 
            position: absolute; 
            background: #16213e; 
            padding: 10px; 
            border-radius: 5px;
            border: 1px solid #00d4ff;
            font-size: 12px;
            pointer-events: none;
            z-index: 100;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 API Performance Heatmap</h1>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value">3</div>
                <div class="stat-label">Total Runs</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">7.9</div>
                <div class="stat-label">Avg RPS</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">229ms</div>
                <div class="stat-label">Avg Latency</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">624ms</div>
                <div class="stat-label">Avg P95</div>
            </div>
        </div>
        
        <div class="heatmap">
            <div class="row">
                <div class="label">Avg Duration</div>
                <div class="cells">
                    <div class="cell" style="background: rgb(255, 0, 100)" title="2026-09-12T06:36: 387.7ms">388</div>
                    <div class="cell" style="background: rgb(1, 253, 100)" title="2026-09-12T06:38: 2.9ms">3</div>
                    <div class="cell" style="background: rgb(195, 59, 100)" title="2026-09-12T06:39: 297.2ms">297</div>
                </div>
            </div>
            <div class="row">
                <div class="label">P95 Duration</div>
                <div class="cells">
                    <div class="cell" style="background: rgb(255, 0, 100)" title="2026-09-12T06:36: 947.1ms">947</div>
                    <div class="cell" style="background: rgb(1, 253, 100)" title="2026-09-12T06:38: 5.5ms">6</div>
                    <div class="cell" style="background: rgb(247, 7, 100)" title="2026-09-12T06:39: 918.4ms">918</div>
                </div>
            </div>
            <div class="row">
                <div class="label">Max Duration</div>
                <div class="cells">
                    <div class="cell" style="background: rgb(255, 0, 100)" title="2026-09-12T06:36: 1953.7ms">1954</div>
                    <div class="cell" style="background: rgb(3, 251, 100)" title="2026-09-12T06:38: 26.0ms">26</div>
                    <div class="cell" style="background: rgb(138, 116, 100)" title="2026-09-12T06:39: 1062.6ms">1063</div>
                </div>
            </div>
            <div class="row">
                <div class="label">Requests/sec</div>
                <div class="cells">
                    <div class="cell" style="background: rgb(113, 141, 100)" title="2026-09-12T06:36: 6.0 RPS">6.0</div>
                    <div class="cell" style="background: rgb(0, 255, 100)" title="2026-09-12T06:38: 10.9 RPS">10.9</div>
                    <div class="cell" style="background: rgb(98, 156, 100)" title="2026-09-12T06:39: 6.7 RPS">6.7</div>
                </div>
            </div>
        </div>
        
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background: rgb(100, 255, 100)"></div>
                <span>Good (Low latency / High RPS)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: rgb(255, 255, 100)"></div>
                <span>Warning</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: rgb(255, 100, 100)"></div>
                <span>Critical (High latency / Low RPS)</span>
            </div>
        </div>
        
        <p style="text-align: center; color: #666; font-size: 12px;">
            Generated: 2026-09-12 12:09:53
        </p>
    </div>
</body>
</html>
