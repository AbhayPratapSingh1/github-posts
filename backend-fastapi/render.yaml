services:
  - type: web
    name: post-panel-api
    runtime: python
    rootDir: backend-fastapi
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python3 scripts/seed.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: post-panel-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY_POST_PANEL
        sync: false
      - key: GITHUB_CLIENT_ID_POST_PANEL
        sync: false
      - key: GITHUB_CLIENT_SECRET_POST_PANEL
        sync: false
    healthCheckPath: /docs
    autoDeploy: true

databases:
  - name: post-panel-db
    plan: free
    databaseName: post_panel
    user: abhaypratapsingh
